services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelpilot
      POSTGRES_USER: travelpilot
      POSTGRES_PASSWORD: travelpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - travelpilot_pgdata:/var/lib/postgresql/data

volumes:
  travelpilot_pgdata: